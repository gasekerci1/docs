<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BecomingOS App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F7F3EA;
      color: #17201B;
      font-family: Inter, system-ui, sans-serif;
    }
    .card {
      max-width: 720px;
      margin: 24px;
      padding: 40px;
      border-radius: 28px;
      background: #EFE6D8;
      border: 1px solid #DDD1C0;
      box-shadow: 0 18px 50px rgba(23, 32, 27, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 44px;
    }
    p {
      color: #4B554E;
      font-size: 18px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 22px;
      border-radius: 999px;
      background: #26352B;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to BecomingOS</h1>
    <p>This is the app placeholder. Replace this page with the real app route when the private beta app is ready.</p>

</html>
