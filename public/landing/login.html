<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BecomingOS Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F7F3EA;
      color: #17201B;
      font-family: Inter, system-ui, sans-serif;
    }
    .card {
      width: min(440px, calc(100% - 32px));
      padding: 36px;
      border-radius: 28px;
      background: #EFE6D8;
      border: 1px solid #DDD1C0;
      box-shadow: 0 18px 50px rgba(23, 32, 27, 0.08);
    }
    h1 {
      margin: 0;
      font-size: 42px;
      text-align: center;
    }
    .tagline {
      margin: 8px 0 28px;
      text-align: center;
      color: #4B554E;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #DDD1C0;
      background: #F7F3EA;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: #26352B;
      color: white;
      font-weight: 800;
      cursor: pointer;
      font-size: 16px;
    }
    p {
      color: #4B554E;
      line-height: 1.6;
    }
    .links {
      margin-top: 18px;
      text-align: center;
    }
    a {
      color: #26352B;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>BecomingOS</h1>
    <p class="tagline">Private personal OS</p>

    <form onsubmit="event.preventDefault(); window.location.href='app/index.html';">
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com" required />
      <button type="submit">Continue to App</button>
    </form>

    <p>BecomingOS is currently in private beta. Request access if you have not been approved yet.</p>

    <div class="links">
      <a href="index.html#signup">Request beta access</a>
      <br /><br />
      <a href="index.html">Back to landing page</a>
    </div>
  </main>
</body>
</html>
